<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Predictor | ML Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="badge">Machine Learning Deployment</div>
            <h1>Iris Species <span class="gradient-text">Classifier</span></h1>
            <p class="subtitle">Deploying a Logistic Regression model via Docker, GitHub Actions, and Flask.</p>
        </header>

        <section class="predictor-card">
            <div class="card-header">
                <i data-lucide="brain-circuit"></i>
                <h2>Model Inference</h2>
            </div>
            
            <form id="prediction-form">
                <div class="input-grid">
                    <div class="input-group">
                        <label for="sepal_length">Sepal Length (cm)</label>
                        <input type="number" id="sepal_length" step="0.1" value="5.1" required>
                    </div>
                    <div class="input-group">
                        <label for="sepal_width">Sepal Width (cm)</label>
                        <input type="number" id="sepal_width" step="0.1" value="3.5" required>
                    </div>
                    <div class="input-group">
                        <label for="petal_length">Petal Length (cm)</label>
                        <input type="number" id="petal_length" step="0.1" value="1.4" required>
                    </div>
                    <div class="input-group">
                        <label for="petal_width">Petal Width (cm)</label>
                        <input type="number" id="petal_width" step="0.1" value="0.2" required>
                    </div>
                </div>
                <button type="submit" id="predict-btn">
                    <span>Analyze Features</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </form>

            <div id="result-area" class="result-area hidden">
                <div class="divider"></div>
                <div class="result-content">
                    <div class="result-label">Predicted Species</div>
                    <div id="prediction-text" class="prediction-value">---</div>
                    <div id="species-icon" class="species-icon">
                        <i data-lucide="flower-2"></i>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <div class="footer-links">
                <a href="#"><i data-lucide="github"></i> Repository</a>
                <a href="#"><i data-lucide="file-text"></i> Documentation</a>
            </div>
            <p>&copy; 2026 ML Deploy Demo. Built with Flask, Scikit-Learn & Docker.</p>
        </footer>
    </main>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
